name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "ERROR: HF_TOKEN secret is not set in GitHub repo settings."
            exit 1
          fi

          git remote add space https://NitinSharmaDS:$HF_TOKEN@huggingface.co/spaces/NitinSharmaDS/Rag_With_Tavily

          git checkout --orphan hf_deploy
          git add -A
          git commit -m "deploy: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push space hf_deploy:main --force
